    - heading "Dating Simulator ( In development )" [level=2] [ref=e78]:
      - text: Dating Simulator
      - emphasis [ref=e80]: ( In development )
    - paragraph [ref=e81]: "WHEN WE LOVE is a hypertextual dating simulator where you date everything: people, birds, poems, historical events, ideas, and more. It is a social poem, a communal gathering, a new possibility."
    - paragraph [ref=e82]: It is a continuous, persistent browser-based game that blurs love offline and online, exploring its countless forms. Inspired by hypertext, Neopets, early net art, roguelikes, Pacthesis, simulation games, Jason Rohrer's work, Homestuck, incrementals, etc. — it is a strange simulation of love, a game infinitely played & clicked through and lived in.
    - paragraph [ref=e83]:
      - emphasis [ref=e84]: Currently in development, starting 2025... stay tuned!
    - heading "Interventions ( Ongoing )" [level=2] [ref=e85]:
      - text: Interventions
      - emphasis [ref=e87]: ( Ongoing )
    - paragraph [ref=e88]:
      - text: Art pieces, performances, and interventions both offline and online, multiplayer and singleplayer, with variable duration, space, and meaning. More than a simple 'game', WHEN WE LOVE is a series of interconnected experiences inviting love to intervene on your everyday life.
