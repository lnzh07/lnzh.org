    - heading "About" [level=2] [ref=e93]
    - paragraph [ref=e94]: "For over 3 years, I've been releasing small interventions about the possibility of love online. In ways, I've been working up the technical skills to make the main 'umbrella' game: When We Love, a massively multiplayer online loving game, a hypertext dating simulator...."
    - paragraph [ref=e95]: I'm in love with continuous game worlds, simulations tended over decades, and places that I return to and live alongside. Love online might bend many mediums... Altogether, an experience, prompt, and realization about love on screens that extends beyond one screen.
    - paragraph [ref=e96]:
      - text: "Thank you: When We Love has been supported by"
      - link "Rhizome's microgrent for net art" [ref=e97] [cursor=pointer]:
        - /url: https://rhizome.org/editorial/2023/aug/02/announcing-2023-microgrant-awardees/
      - text: ", presented at"
      - link "Now Play This" [ref=e98] [cursor=pointer]:
        - /url: https://nowplaythis.net/2023-festival/
      - text: . I'm grateful.
    - paragraph [ref=e99]:
      - text: Do you care about websites that truly feel like worlds, infinite and emergent? What about websites that talk about love, or are simply peotic or experimental?
      - text: I'd love to get some grant or residency time to put my heart into When We Love further; still, look for releases throughout the year.
