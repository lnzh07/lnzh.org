                  - text: . The rest is memory." – Louise Gluck
            - paragraph [ref=e40]: A bedroom in suburban Las Piñas, sometime early 2000. Girls compressed in objects, prayer attributed to action, sainthood provided through asking. Vignettes, selfhoods, and memories from Manila unfolded over years, landscapes, and ways of seeing. A becoming through other people, game shows, television, religion, and dreams. A narrative 'escapist room' recalling 18 years of youth, identity, selfhood, and objecthood in Manila.
            - paragraph [ref=e41]:
              - emphasis [ref=e42]: A Bedroom in Las Piñas is an ode to early flash escape room games and Jake Elliott's A House in California in a surrealist point-and-click martyrdom simulator. Unfolded entirely through verb-object interactions where you touch, feel, pray, forget, crucify, and castigate the self – logic and language is rewritten.
            - paragraph [ref=e43]: About 10k words, mostly made in under a week on December 2023 for myself.
            - paragraph [ref=e44]:
              - emphasis [ref=e45]: "\"Everyone who tries to reach for the heavens seems to land in Manila.\""
            - paragraph [ref=e46]:
              - text: ( Playtime )
